[package]
name = "tracebeam"
version = "0.6.0"
description = "Fast JSONL log explorer"
edition = "2021"

[lib]
name = "tracebeam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "=1.12.2"
chrono = "0.4"
