name: 'release'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - platform: 'windows-latest'
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # This matches tauri's default project layout. Change this if you have a different layout.
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install --frozen-lockfile # change this to npm, yarn or pnpm depending on which one you use.

      - name: verify release configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
            test "$GITHUB_REF_NAME" = "$expected_tag" || { echo "Tag $GITHUB_REF_NAME does not match app version $expected_tag"; exit 1; }
          fi

      # Public Release download URLs keep anonymous desktop clients away from
      # the GitHub REST API's shared low rate limit.
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Tracebeam v__VERSION__'
          releaseBody: 'Download the installer below or update from inside Tracebeam.'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  verify-updater-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: verify updater metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json

          for platform in darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app windows-x86_64 windows-x86_64-nsis; do
            jq --exit-status --arg platform "$platform" \
              '.platforms[$platform].url | type == "string" and length > 0' latest.json >/dev/null
            jq --exit-status --arg platform "$platform" \
              '.platforms[$platform].signature | type == "string" and length > 0' latest.json >/dev/null
          done

          if jq --exit-status \
            '[.platforms[].url | startswith("https://api.github.com/")] | any' latest.json >/dev/null; then
            echo "Updater metadata contains rate-limited GitHub API download URLs"
            exit 1
          fi

  publish-release:
    needs: verify-updater-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify-updater-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
